<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#020406" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>NOA: AFTER BELL — 3D Rebuild</title>
</head>
<body>
  <div id="app">
    <canvas id="renderCanvas" tabindex="0"></canvas>
    <div id="grain"></div>

    <div id="hud">
      <div id="objective">目的：体育館の非常口へ向かう</div>
      <div id="toast"></div>
      <div id="crosshair"></div>

      <div id="joystick-zone">
        <div id="joystick-base"><div id="joystick-knob"></div></div>
      </div>
      <div id="look-zone"></div>

      <button class="hud-button" id="flashlight-button" aria-label="懐中電灯">🔦</button>
      <button class="hud-button" id="phone-button">NOA</button>

      <section id="phone">
        <div id="phone-header"><span>NOA</span><span>00:03</span></div>
        <div id="phone-feed"></div>
      </section>
    </div>

    <section id="start-screen">
      <div class="start-card">
        <div class="eyebrow">NOA / 3D REBUILD</div>
        <h1>AFTER BELL</h1>
        <p class="subtitle">FIRST WALK — v0.2</p>
        <button id="enter-button">校舎に入る</button>
        <div id="boot-status">LOADING</div>
      </div>
    </section>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
