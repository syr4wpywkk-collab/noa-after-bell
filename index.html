<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#05080a" />
<title>NOA: After Bell — Mobile</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="objective">目的：体育館の先の EXIT を探す</div>
  <div id="toast"></div>
  <div id="crosshair"></div>
  <div id="leftZone"><div id="stickBase"><div id="stickKnob"></div></div></div>
  <div id="lookZone"></div>
  <button class="btn" id="flashBtn" aria-label="懐中電灯">🔦</button>
  <button class="btn" id="phoneBtn">NOA</button>
  <button class="btn" id="fsBtn" aria-label="全画面">⛶</button>
  <div id="phone">
    <div id="phoneHeader"><span>NOA</span><span id="clock">00:00</span></div>
    <div id="phoneBody">まだ大丈夫。

体育館だけ明るい。
出口はその奥にありそう。</div>
  </div>
</div>
<div id="start">
  <h1>AFTER BELL</h1>
  <div class="sub">NOA / MOBILE PROTOTYPE</div>
  <button id="startBtn">校舎に入る</button>
  <div class="tip">左親指：移動　右側スワイプ：視点<br>🔦：懐中電灯　NOA：スマホ</div>
</div>
<div id="ending">
  <h2>OUTSIDE.</h2>
  <p>校舎の外に出た。<br>振り返る必要はない。</p>
  <button id="retryBtn">もう一度</button>
</div>
<script src="./game1.js"></script>
<script src="./game2.js"></script>
</body>
</html>
