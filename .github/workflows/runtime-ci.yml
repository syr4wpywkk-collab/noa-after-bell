name: Runtime CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: runtime-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Logic tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Client secret boundary
        run: |
          if grep -R -n -E "OPENAI_API_KEY|SUPABASE_(SERVICE_ROLE|SECRET)_KEY" src public --exclude-dir=tests; then
            echo "Server-only secret identifier found in client sources."
            exit 1
          fi
